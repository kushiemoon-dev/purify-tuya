[project]
name = "purify-backend"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "tinytuya>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2>=0.28",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["services", "drivers", "api"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
    "UP007",  # Use X | Y for union types — not compatible with runtime isinstance checks on 3.13
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "ARG"]  # assert ok in tests
"main.py" = ["F401"]  # driver imports are side-effectful registrations
"api/**/*.py" = ["B008"]  # FastAPI Depends() in default args is intentional
"models.py" = ["UP042"]  # legacy file, to be removed in Phase 4

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["services.*", "drivers.*", "api.*", "db.*", "schemas.*"]
disallow_untyped_defs = true
